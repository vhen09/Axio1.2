<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn LaTeX - Axio Tutorial</title>
  <link rel="stylesheet" href="../css/axio-app.css" />
  <!-- MathJax for LaTeX rendering -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="../js/global-settings.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 350px 1fr 1fr;
      gap: 25px;
    }

    /* === SIDEBAR === */
    .sidebar {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      padding: 25px;
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e2e8f0;
    }

    .avatar {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .sidebar-header h2 {
      font-size: 1.2rem;
      color: #0f172a;
      margin: 0;
    }

    .progress-section {
      margin-bottom: 20px;
    }

    .progress-label {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .progress-bar {
      height: 4px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #059669 0%, #10b981 100%);
      transition: width 0.3s ease;
    }

    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lesson-item {
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.3s ease;
      border-left: 4px solid transparent;
      font-size: 0.95rem;
      color: #475569;
      font-weight: 500;
    }

    .lesson-item:hover {
      background: #e2e8f0;
      transform: translateX(4px);
    }

    .lesson-item.active {
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      color: #0f766e;
      border-left-color: #059669;
    }

    .lesson-item.completed {
      color: #10b981;
    }

    .lesson-item.completed::before {
      content: "✓ ";
      font-weight: 700;
    }

    /* === MAIN CONTENT === */
    .main-content {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      padding: 35px;
      min-height: 600px;
    }

    .lesson-header {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 2px solid #e2e8f0;
    }

    .lesson-title {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .lesson-subtitle {
      font-size: 0.95rem;
      color: #64748b;
    }

    .content-section {
      margin-bottom: 30px;
    }

    .content-section h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .content-text {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.8;
      margin-bottom: 12px;
    }

    .code-block {
      background: #1e293b;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      font-family: Monaco, 'Courier New', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin-bottom: 16px;
      border: 1px solid #334155;
      line-height: 1.6;
    }

    .info-box {
      background: #f0fdf4;
      border-left: 4px solid #059669;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .info-box.info {
      background: #dbeafe;
      border-left-color: #0284c7;
    }

    .info-box.warning {
      background: #fef3c7;
      border-left-color: #f59e0b;
    }

    .symbol-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .symbol-table th,
    .symbol-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    .symbol-table th {
      background: #f8fafc;
      font-weight: 700;
      color: #0f172a;
    }

    .symbol-table code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: Monaco, monospace;
    }

    /* === EDITOR PANEL === */
    .editor-panel {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 700px;
    }

    .editor-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
      color: white;
      padding: 16px 20px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 20px;
      gap: 15px;
    }

    .editor-input {
      flex: 1;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-family: Monaco, monospace;
      font-size: 0.9rem;
      resize: none;
      transition: border-color 0.3s;
    }

    .editor-input:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    .preview {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      font-size: 1.1rem;
    }

    .preview.error {
      color: #dc2626;
      font-style: italic;
    }

    /* === BOTTOM NAVIGATION === */
    .nav-buttons {
      display: flex;
      gap: 15px;
      margin-top: 30px;
      padding-top: 25px;
      border-top: 2px solid #e2e8f0;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
      flex: 1;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .completion-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      animation: fadeIn 0.3s;
    }

    .completion-overlay.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .completion-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .completion-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: bounce 0.6s;
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .completion-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #059669;
      margin-bottom: 12px;
    }

    .completion-text {
      font-size: 1rem;
      color: #475569;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    @media (max-width: 1200px) {
      .container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: relative;
        top: 0;
      }
      .editor-panel {
        height: auto;
        min-height: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- === SIDEBAR === -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="avatar">A</div>
        <div>
          <h2>Axio</h2>
          <p style="color: #64748b; font-size: 0.8rem; margin: 0;">Your LaTeX Guide</p>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-label">Progress</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div style="font-size: 0.8rem; color: #64748b; margin-top: 8px;">
          <span id="progressText">Lesson 1 of 5</span>
        </div>
      </div>

      <div class="lesson-list" id="lessonList"></div>
    </div>

    <!-- === MAIN CONTENT === -->
    <div class="main-content" id="mainContent"></div>

    <!-- === EDITOR PANEL === -->
    <div class="editor-panel">
      <div class="editor-header">
        <span>LaTeX Sandbox</span>
        <span style="font-size: 0.85rem; opacity: 0.9;">Live Preview</span>
      </div>
      <div class="editor-body">
        <textarea class="editor-input" id="editor" placeholder="Write LaTeX code here..." spellcheck="false"></textarea>
        <button class="btn btn-primary" onclick="renderPreview()">Render</button>
        <div class="preview" id="preview">Enter LaTeX code to see preview...</div>
      </div>
    </div>
  </div>

  <!-- Completion Modal -->
  <div class="completion-overlay" id="completionOverlay">
    <div class="completion-card">
      <div class="completion-icon">🎉</div>
      <div class="completion-title">Congratulations!</div>
      <div class="completion-text">
        You've mastered LaTeX basics and are ready to write mathematical proofs in Axio.
      </div>
      <button class="btn btn-primary" style="width: 100%; cursor: wait;" disabled>
        🎓 Redirecting to Dashboard...
      </button>
    </div>
  </div>

  <script>
    const lessons = [
      {
        id: 1,
        title: "What is LaTeX? 📖",
        subtitle: "A powerful language for mathematics",
        content: `
          <div class="content-section">
            <h3>👋 Welcome to LaTeX Learning!</h3>
            <p class="content-text">
              I'm <strong>Axio</strong>, your personal LaTeX mentor. Over the next 5 lessons, 
              you'll learn to write beautiful mathematical proofs using LaTeX—the language 
              used by mathematicians worldwide!
            </p>
          </div>

          <div class="content-section">
            <h3>🎯 What is LaTeX?</h3>
            <p class="content-text">
              LaTeX is a document preparation system that specializes in mathematical typesetting.

              that LaTeX transforms into beautiful output.
            </p>
            <div class="info-box">

          <div class="content-section">
            <h3>📚 In This Tutorial You'll Learn</h3>

            </ul>
          </div>

          <div class="info-box info">
            <strong>🎮 Interactive Learning:</strong> Each lesson includes a sandbox on the right where you can

          </div>
        `,
        starterCode: `% LaTeX comments start with %
% This is your first LaTeX code!

Hello, Mathematics!
        `
      },
      {
        id: 2,
        title: "Math Mode & Basic Symbols 🔢",
        subtitle: "Writing equations and mathematical expressions",
        content: `
          <div class="content-section">
            <h3>📝 Math Mode Basics</h3>
            <p class="content-text">
              In LaTeX, text and mathematics are processed differently. To write math, you need to enter "math mode."
            </p>
            <p class="content-text"><strong>Two types of math mode:</strong></p>
            <table class="symbol-table">
              <tr>
                <th>Type</th>
                <th>Syntax</th>
                <th>When to Use</th>
              </tr>
              <tr>
                <td><strong>Inline Math</strong></td>
                <td><code>$...$</code></td>
                <td>Math within a sentence or paragraph</td>
              </tr>
              <tr>
                <td><strong>Display Math</strong></td>
                <td><code>$$...$$</code></td>
                <td>Large equations on their own line</td>
              </tr>
            </table>
          </div>

          <div class="content-section">
            <h3>🔠 Basic Mathematical Symbols</h3>
            <p class="content-text">Here are the most common symbols you'll use:</p>
            <div class="code-block">$a + b$    addition
$a - b$    subtraction
$a \\times b$  multiplication (letter x)
$a \\cdot b$   multiplication (centered dot)
$a / b$ or $\\frac{a}{b}$  division
$a = b$    equals</div>

            <p class="content-text"><strong>Comparison symbols:</strong></p>
            <table class="symbol-table">
              <tr>
                <th>Command</th>
                <th>Symbol</th>
                <th>Meaning</th>
              </tr>
              <tr>
                <td><code>\\geq</code></td>
                <td>≥</td>
                <td>Greater than or equal</td>
              </tr>
              <tr>
                <td><code>\\leq</code></td>
                <td>≤</td>
                <td>Less than or equal</td>
              </tr>
              <tr>
                <td><code>\\neq</code></td>
                <td>≠</td>
                <td>Not equal</td>
              </tr>
              <tr>
                <td><code>\\approx</code></td>
                <td>≈</td>
                <td>Approximately equal</td>
              </tr>
            </table>
          </div>

          <div class="info-box">
            <strong>📝 Pro Tip:</strong> Notice how commands start with a backslash <code>\\</code>. 
            This tells LaTeX "I'm using a special command."
          </div>
        `,
        starterCode: `$x + y = z$

$a \\geq b$

$p \\neq q$

$\\frac{1}{2} + \\frac{1}{3}$
        `
      },
      {
        id: 3,
        title: "Advanced Math: Fractions & Roots ➗",
        subtitle: "Working with complex mathematical structures",
        content: `
          <div class="content-section">
            <h3>🔢 Fractions</h3>
            <p class="content-text">
              Use the <code>\\frac</code> command to create fractions. The syntax is:
            </p>
            <div class="code-block">\\frac{numerator}{denominator}</div>
            <p class="content-text"><strong>Examples:</strong></p>
            <div class="code-block">$\\frac{a}{b}$             % Simple fraction

$\\frac{x + 1}{x - 1}$    % Fraction with expressions

$\\frac{1}{2} + \\frac{1}{3} = \\frac{5}{6}$  % Multiple fractions</div>
          </div>

          <div class="content-section">
            <h3>√ Square Roots & nth Roots</h3>
            <p class="content-text">
              The <code>\\sqrt</code> command creates square roots. For nth roots, add <code>[n]</code>:
            </p>
            <div class="code-block">\\sqrt{x}           % Square root

\\sqrt[3]{8}        % Cube root (n=3)

\\sqrt[n]{x}        % General nth root</div>
            <p class="content-text"><strong>Examples:</strong></p>
            <div class="code-block">$\\sqrt{4} = 2$

$\\sqrt{x^2 + y^2}$

$\\sqrt[3]{27} = 3$</div>
          </div>

          <div class="content-section">
            <h3>⬇️ Subscripts and Superscripts</h3>
            <p class="content-text">
              Use <code>_</code> for subscripts (below) and <code>^</code> for superscripts (above):
            </p>
            <table class="symbol-table">
              <tr>
                <th>Command</th>
                <th>Result</th>
                <th>Name</th>
              </tr>
              <tr>
                <td><code>x_1</code></td>
                <td>x₁</td>
                <td>Subscript (single character)</td>
              </tr>
              <tr>
                <td><code>x_{i+1}</code></td>
                <td>x_{i+1}</td>
                <td>Subscript (multiple characters - needs {})</td>
              </tr>
              <tr>
                <td><code>x^2</code></td>
                <td>x²</td>
                <td>Superscript (square)</td>
              </tr>
              <tr>
                <td><code>x^{n+1}</code></td>
                <td>x^{n+1}</td>
                <td>Superscript (multiple characters)</td>
              </tr>
            </table>
          </div>

          <div class="info-box warning">
            <strong>⚠️ Important:</strong> When you have more than one character in a subscript or superscript, 
            wrap it in curly braces <code>{}</code>. For example: <code>x_{i+1}</code> not <code>x_i+1</code>
          </div>
        `,
        starterCode: `% Fractions
$\\frac{1}{2}$

% Roots  
$\\sqrt{9} = 3$

% Subscripts and superscripts
$x_1 + x_2 = x_3$

$e^{i\\pi} + 1 = 0$
        `
      },
      {
        id: 4,
        title: "Summation & Special Symbols Σ",
        subtitle: "Working with summations, integrals, and special mathematics",
        content: `
          <div class="content-section">
            <h3>∑ Summation</h3>
            <p class="content-text">
              The summation symbol uses <code>\\sum</code> with limits:
            </p>
            <div class="code-block">\\sum_{i=1}^{n} i         % Sum from i=1 to n

\\sum_{i=1}^{\\infty} \\frac{1}{i^2}  % Infinite sum</div>

            <p class="content-text"><strong>Understanding the parts:</strong></p>
            <ul style="margin-left: 20px;">
              <li><code>\\sum</code> - The summation symbol</li>
              <li><code>_{i=1}</code> - Lower limit (starts at i=1)</li>
              <li><code>^{n}</code> - Upper limit (ends at n)</li>
              <li><code>i</code> - What gets summed</li>
            </ul>
          </div>

          <div class="content-section">
            <h3>∫ Integrals</h3>
            <p class="content-text">Integrals work similarly to summations:</p>
            <div class="code-block">\\int_0^{1} x^2 \\, dx    % Integral from 0 to 1 of x²

\\int_{-\\infty}^{\\infty} e^{-x^2} dx</div>

          <div class="content-section">

            <p class="content-text">Greek letters are written with  \\alpha, \\beta, etc.</p>

                <th>Command</th>
                <th>Symbol</th>
              </tr>

                <td>α</td>
                <td><code>\\Alpha</code></td>

              </tr>
              <tr>

        starterCode: `% Summation

$\\int_0^{\\pi} \\sin(x) \\, dx = 2$

% Greek letters
$\\alpha + \\beta = \\gamma$

%Infinity

        `
      },
      {
        id: 5,
        title: "Theorems & Complete Proofs 🎯",
        subtitle: "Putting everything together",
        content: `
          <div class="content-section">
            <h3>📐 Theorem Structure</h3>
            <p class="content-text">
              A complete LaTeX theorem includes the statement and proof:
            </p>
            <div class="code-block">\\begin{theorem}
  The sum \\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}
\\end{theorem}

\\begin{proof}
  By mathematical induction.
\\end{proof}</div>

            <p class="content-text"><strong>Breaking it down:</strong></p>
            <ul style="margin-left: 20px;">
              <li><code>\\begin{theorem}..\\end{theorem}</code> - Defines the theorem</li>
              <li><code>\\begin{proof}..\\end{proof}</code> - Contains the proof</li>
              <li>LaTeX automatically numbers theorems and proofs</li>
            </ul>
          </div>

          <div class="content-section">
            <h3>✍️ Writing a Complete Proof</h3>
            <p class="content-text">Here's a realistic example combining all concepts:</p>
            <div class="code-block">\\begin{theorem}
  If $a$ and $b$ are positive real numbers, then 
  $$\\frac{a + b}{2} \\geq \\sqrt{ab}$$
  (Arithmetic Mean ≥ Geometric Mean)
\\end{theorem}

\\begin{proof}
  Consider $(\\sqrt{a} - \\sqrt{b})^2 \\geq 0$.
  
  Expanding: $a - 2\\sqrt{ab} + b \\geq 0$
  
  Therefore: $a + b \\geq 2\\sqrt{ab}$
  
  Dividing by 2: $\\frac{a+b}{2} \\geq \\sqrt{ab}$
\\end{proof}</div>
          </div>

          <div class="content-section">
            <h3>🎓 Key Takeaways</h3>
            <ul style="margin-left: 20px;">
              <li><strong>Math mode:</strong> Use $ for inline, $$ for display</li>

              <li><strong>Grouping:</strong> Use {} for multiple characters</li>
              <li><strong>Symbols:</strong> Greek letters, operators, relations</li>
              <li><strong>Structures:</strong> Fractions, roots, sums, theorems</li>
            </ul>
          </div>

          <div class="info-box">
            <strong>🚀 You're Ready!</strong> You now have all the tools to write mathematical proofs in Axio. 
            Start with simple theorems and gradually increase complexity. Happy proving!
          </div>
        `,
        starterCode: `\\begin{theorem}
  The sum \\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}
\\end{theorem}

\\begin{proof}
  By induction on $n$.
\\end{proof}
        `
      }
    ];

    let currentLesson = 0;

    function init() {
      renderLessonList();
      renderLesson(0);
      loadEditor(0);
    }

    function renderLessonList() {
      const list = document.getElementById('lessonList');
      list.innerHTML = lessons.map((lesson, i) => `
        <div class="lesson-item ${i === 0 ? 'active' : ''}" onclick="goToLesson(${i})">
          ${lesson.title}
        </div>
      `).join('');
    }

    function renderLesson(index) {
      if (index < 0 || index >= lessons.length) return;
      
      currentLesson = index;
      const lesson = lessons[index];
      
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="lesson-header">
          <div class="lesson-title">${lesson.title}</div>
          <div class="lesson-subtitle">${lesson.subtitle}</div>
        </div>
        <div>${lesson.content}</div>
        <div class="nav-buttons">
          <button class="btn btn-secondary" onclick="previousLesson()" ${index === 0 ? 'disabled' : ''}>
            ← Previous
          </button>
          <button class="btn btn-primary" onclick="nextLesson()">
            ${index === lessons.length - 1 ? 'Complete Tutorial' : 'Next →'}
          </button>
        </div>
      `;

      updateProgress();
      loadEditor(index);
    }

    function goToLesson(index) {
      renderLesson(index);
      window.scrollTo(0, 0);
    }

    function nextLesson() {
      if (currentLesson < lessons.length - 1) {
        renderLesson(currentLesson + 1);
      } else {
        completeTutorial();
      }
    }

    function previousLesson() {
      if (currentLesson > 0) {
        renderLesson(currentLesson - 1);
      }
    }

    function loadEditor(index) {
      document.getElementById('editor').value = lessons[index].starterCode;
      renderPreview();
    }

    // Convert LaTeX to Natural Language Interpretation
    function latexToNaturalLanguage(latex) {
      let text = latex;
      
      // Common LaTeX to natural language mappings
      const replacements = [
        [/\\frac\{([^}]+)\}\{([^}]+)\}/g, 'fraction $1 over $2'],
        [/\\sqrt\[([^\]]+)\]\{([^}]+)\}/g, '$1-th root of $2'],
        [/\\sqrt\{([^}]+)\}/g, 'square root of $1'],
        [/\\geq/g, '≥ (greater than or equal)'],
        [/\\leq/g, '≤ (less than or equal)'],
        [/\\neq/g, '≠ (not equal)'],
        [/\\approx/g, '≈ (approximately equal)'],
        [/\\times/g, '× (multiply)'],
        [/\\cdot/g, '· (multiply)'],
        [/\^([{]?[^}]*[}]?)/g, 'to the power $1'],
        [/_([{]?[^}]*[}]?)/g, 'subscript $1'],
        [/\\sum/g, 'sum'],
        [/\\prod/g, 'product'],
        [/\\int/g, 'integral'],
        [/\\pi/g, 'π (pi)'],
        [/\\alpha/g, 'α (alpha)'],
        [/\\beta/g, 'β (beta)'],
        [/\\gamma/g, 'γ (gamma)'],
        [/\\theta/g, 'θ (theta)'],
        [/\\lambda/g, 'λ (lambda)'],
        [/\\Delta/g, 'Δ (Delta)'],
        [/\\infty/g, '∞ (infinity)'],
        [/\\forall/g, '∀ (for all)'],
        [/\\exists/g, '∃ (there exists)'],
      ];
      
      for (let [pattern, replacement] of replacements) {
        text = text.replace(pattern, replacement);
      }
      
      // Remove dollar signs and extra braces
      text = text.replace(/[\${}]/g, '');
      text = text.replace(/\\\\/g, ' ');
      
      return text.trim();
    }

    // Extract and interpret math expressions from LaTeX code
    function extractMathExpressions(code) {
      const expressions = [];
      
      // Match $...$ (inline) and $$...$$ (display)
      const inlineRegex = /\$([^$]+)\$/g;
      let match;
      
      while ((match = inlineRegex.exec(code)) !== null) {
        const latex = match[1].trim();
        if (latex && !expressions.includes(latex)) {
          const natural = latexToNaturalLanguage(latex);
          expressions.push({
            latex: latex,
            natural: natural
          });
        }
      }
      
      return expressions;
    }

    function renderPreview() {
      const code = document.getElementById('editor').value;
      const preview = document.getElementById('preview');

      if (!code.trim()) {
        preview.innerHTML = 'Enter LaTeX code to see preview...';
        preview.classList.remove('error');
        return;
      }

      // Extract math expressions
      const expressions = extractMathExpressions(code);
      
      // Build preview with natural language + rendered output
      let previewHTML = '';
      
      if (expressions.length > 0) {
        previewHTML += '<div style="background: #f0f9ff; border-left: 4px solid #0ea5e9; padding: 12px; margin-bottom: 15px; border-radius: 4px;">';
        previewHTML += '<div style="font-weight: 600; color: #0369a1; margin-bottom: 8px; font-size: 0.9rem;">📝 What This Means:</div>';
        previewHTML += '<ul style="margin: 0; padding-left: 20px; font-size: 0.85rem; color: #0c4a6e;">';
        
        expressions.forEach(expr => {
          previewHTML += `<li>${expr.natural}</li>`;
        });
        
        previewHTML += '</ul></div>';
      }
      
      // Add the rendered equation section
      previewHTML += '<div style="border-top: 1px solid #e5e7eb; padding-top: 12px;">';
      previewHTML += '<div style="font-weight: 600; color: #64748b; margin-bottom: 8px; font-size: 0.9rem;">📐 Rendered Output:</div>';
      
      let wrapped = code;
      if (!wrapped.includes('$') && !wrapped.includes('\\begin')) {
        wrapped = '$$' + wrapped + '$$';
      }
      
      previewHTML += '<div style="font-size: 1.1rem; line-height: 1.8;">' + wrapped + '</div>';
      previewHTML += '</div>';
      
      preview.innerHTML = previewHTML;
      preview.classList.remove('error');

      if (window.MathJax) {
        window.MathJax.typesetPromise([preview]).catch(err => {
          preview.innerHTML = '⚠️ LaTeX error. Check your syntax.';
          preview.classList.add('error');
        });
      }
    }

    function updateProgress() {
      const progress = ((currentLesson + 1) / lessons.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      document.getElementById('progressText').textContent = `Lesson ${currentLesson + 1} of ${lessons.length}`;

      const items = document.querySelectorAll('.lesson-item');
      items.forEach((item, i) => {
        item.classList.toggle('active', i === currentLesson);
        item.classList.toggle('completed', i < currentLesson);
      });
    }

    function completeTutorial() {
      document.getElementById('completionOverlay').classList.add('show');
      saveCompletion();
    }

    async function saveCompletion() {
      try {
        const apiUrl = `${window.location.protocol}//${window.location.host}/backend/api/user-preferences.php?action=complete_latex_tutorial`;
        const response = await fetch(apiUrl, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latex_tutorial_completed: true })
        });
        
        const result = await response.json();
        if (result.success) {
          console.log('✅ Tutorial marked as complete');
          // Mark as completed in localStorage so dashboard doesn't redirect back
          localStorage.setItem('latex_tutorial_completed', 'true');
          // Clear new_user flag since they've completed onboarding
          sessionStorage.removeItem('new_user');
          // Proceed to dashboard after a short delay
          setTimeout(() => startMainApp(), 1500);
        }
      } catch (e) {
        console.error('Error saving tutorial completion:', e);
        // Even if API fails, mark locally and continue
        localStorage.setItem('latex_tutorial_completed', 'true');
        sessionStorage.removeItem('new_user');
        setTimeout(() => startMainApp(), 1500);
      }
    }

    function startMainApp() {
      // Redirect to dashboard after tutorial completion so user can start proving
      window.location.href = '/frontend/pages/dashboard.html';
    }

    document.getElementById('editor').addEventListener('input', renderPreview);
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
