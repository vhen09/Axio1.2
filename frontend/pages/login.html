<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axio - Login</title>
  <link rel="stylesheet" href="../css/axio-app.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .auth-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
      color: white;
      padding: 32px 24px;
      text-align: center;
    }

    .auth-header h1 {
      font-size: 1.6rem;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .auth-header p {
      font-size: 0.9rem;
      opacity: 0.9;
      margin: 0;
    }

    .auth-content {
      padding: 32px 24px;
    }

    .auth-form {
      display: grid;
      gap: 14px;
    }

    .form-group {
      display: grid;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 45px !important;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      color: #64748b;
    }

    .password-toggle:hover {
      color: #059669;
      background: rgba(5, 150, 105, 0.08);
    }

    .password-toggle:active {
      transform: scale(0.95);
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .form-actions {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-primary {
      background: #059669;
      color: white;
    }

    .btn-primary:hover {
      background: #047857;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .auth-toggle {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 0.9rem;
      color: #475569;
    }

    .auth-toggle-link {
      background: none;
      border: none;
      color: #059669;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-left: 4px;
      padding: 0;
      display: inline;
    }

    .auth-toggle-link:hover {
      color: #047857;
    }

    .auth-message {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      min-height: 20px;
      display: none;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.success {
      background: #d1fae5;
      color: #065f46;
    }

    .auth-message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      color: #059669;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .forgot-password {
      text-align: center;
      margin-top: 12px;
    }

    .forgot-password a {
      color: #059669;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .auth-container {
        border-radius: 12px;
      }

      .auth-content {
        padding: 24px 20px;
      }

      .auth-header {
        padding: 24px 20px;
      }

      .auth-header h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Log in to continue your learning</p>
    </div>

    <div class="auth-content">
      <form id="auth-form" class="auth-form">
        <!-- Username -->
        <div class="form-group">
          <label>Username</label>
          <input id="username" type="text" placeholder="Enter your username" required />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input id="password" type="password" placeholder="Enter your password" required />
            <button type="button" class="password-toggle" id="toggle-password-btn" onclick="togglePasswordVisibility()" title="Show/hide password">
              <svg id="password-icon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="auth-message" id="auth-message"></div>

        <!-- Forgot Password -->
        <div class="forgot-password">
          <a href="#" id="forgot-password-link">Forgot password?</a>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Log In</button>
        </div>
      </form>

      <!-- Toggle -->
      <div class="auth-toggle">
        <span>Don't have an account?</span>
        <a href="auth.html" class="auth-toggle-link">Sign Up</a>
      </div>

      <a href="landing.html" class="back-link">← Back to home</a>
    </div>
  </div>

  <script>
    const messageEl = document.getElementById('auth-message');

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('password-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        passwordInput.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function showMessage(text, type = 'error') {
      messageEl.textContent = text;
      messageEl.className = `auth-message show ${type}`;
      setTimeout(() => {
        messageEl.classList.remove('show');
      }, 5000);
    }

    async function handleLogin(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username) {
        showMessage('Please enter your username');
        return;
      }
      if (!password) {
        showMessage('Please enter your password');
        return;
      }

      try {
        const response = await fetch('../../backend/api/auth.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'login',
            username: username,
            password: password
          }),
          credentials: 'include'
        });

        const data = await response.json();
        console.log('Login response:', data);
        
        if (data.success) {
          showMessage('Login successful! Redirecting...', 'success');
          sessionStorage.setItem('user_id', data.user_id);
          sessionStorage.setItem('username', data.username);
          
          setTimeout(() => {
            window.location.href = 'landing.html';
          }, 500);
        } else {
          showMessage(data.message || 'Login failed');
          console.error('Login failed:', data);
        }
      } catch (err) {
        console.error('Login error:', err);
        showMessage('An error occurred. Please try again.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('auth-form').addEventListener('submit', handleLogin);
      
      document.getElementById('forgot-password-link').addEventListener('click', (e) => {
        e.preventDefault();
        showMessage('Password reset feature coming soon. Please contact support.', 'error');
      });
    });
  </script>
</body>
</html>
