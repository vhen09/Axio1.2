<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs - AXIO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #059669;
            color: white;
        }

        .btn-primary:hover {
            background: #047857;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-secondary.active {
            background: #059669;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #059669;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .activity-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .activity-table thead {
            background: #f3f4f6;
            border-bottom: 2px solid #e5e7eb;
        }

        .activity-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        .activity-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
        }

        .activity-table tbody tr:hover {
            background: #f9fafb;
        }

        .action-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .action-login {
            background: #dbeafe;
            color: #0c4a6e;
        }

        .action-logout {
            background: #fee2e2;
            color: #7c2d12;
        }

        .action-signup {
            background: #dcfce7;
            color: #14532d;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top-color: #059669;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .timestamp {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .ip-address {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .metadata {
            font-size: 0.8rem;
            color: #9ca3af;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Activity Logs</h1>
        <p style="color: #6b7280; margin-bottom: 24px;">Track your account access and activities</p>

        <div class="nav-buttons">
            <button class="btn btn-secondary active" onclick="loadActivities('my_activities')">My Activities</button>
            <button class="btn btn-secondary" onclick="loadActivities('login_history')">Login History</button>
            <button class="btn btn-secondary" onclick="loadActivities('user_stats')">Statistics</button>
            <button class="btn btn-primary" onclick="location.reload()">Refresh</button>
        </div>

        <div id="error" style="display: none;"></div>
        <div id="stats" style="display: none;"></div>
        <div id="content"></div>
    </div>

    <script>
        const API_BASE = `${window.location.protocol}//${window.location.host}/backend/api`;

        async function loadActivities(action) {
            // Update button states
            document.querySelectorAll('.nav-buttons .btn-secondary').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            const errorDiv = document.getElementById('error');
            const statsDiv = document.getElementById('stats');
            const contentDiv = document.getElementById('content');

            errorDiv.style.display = 'none';
            statsDiv.style.display = 'none';
            contentDiv.innerHTML = '<div class="loading">Loading data</div>';

            try {
                const response = await fetch(`${API_BASE}/activity-logs.php?action=${action}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                if (!data.success) {
                    errorDiv.innerHTML = `<div class="error">⚠️ ${data.error || 'Failed to load data'}</div>`;
                    errorDiv.style.display = 'block';
                    contentDiv.innerHTML = '';
                    return;
                }

                if (action === 'user_stats') {
                    displayStatistics(data.statistics);
                } else if (action === 'login_history') {
                    displayLoginHistory(data.login_history);
                } else {
                    displayActivities(data.activities);
                }

            } catch (error) {
                console.error('Error:', error);
                errorDiv.innerHTML = `<div class="error">❌ ${error.message}</div>`;
                errorDiv.style.display = 'block';
                contentDiv.innerHTML = '';
            }
        }

        function displayStatistics(stats) {
            const statsDiv = document.getElementById('stats');
            const contentDiv = document.getElementById('content');

            statsDiv.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_logins || 0}</div>
                        <div class="stat-label">Total Logins</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_activities || 0}</div>
                        <div class="stat-label">Total Activities</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.last_login ? new Date(stats.last_login).toLocaleDateString() : '—'}</div>
                        <div class="stat-label">Last Login</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.last_activity ? new Date(stats.last_activity).toLocaleDateString() : '—'}</div>
                        <div class="stat-label">Last Activity</div>
                    </div>
                </div>

                ${stats.ip_addresses && stats.ip_addresses.length > 0 ? `
                    <h3 style="margin-top: 24px; margin-bottom: 12px; color: #0f172a;">Locations (IP Addresses)</h3>
                    <table class="activity-table">
                        <thead>
                            <tr>
                                <th>IP Address</th>
                                <th>Times Accessed</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${stats.ip_addresses.map(ip => `
                                <tr>
                                    <td class="ip-address">${ip.ip_address}</td>
                                    <td>${ip.count} times</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                ` : ''}
            `;

            statsDiv.style.display = 'block';
            contentDiv.innerHTML = '';
        }

        function displayLoginHistory(activities) {
            const contentDiv = document.getElementById('content');

            if (!activities || activities.length === 0) {
                contentDiv.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📋</div>
                        <p>No login history found</p>
                    </div>
                `;
                return;
            }

            contentDiv.innerHTML = `
                <h3 style="margin-bottom: 12px; color: #0f172a;">Recent Logins & Logouts</h3>
                <table class="activity-table">
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Date & Time</th>
                            <th>IP Address</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${activities.map(activity => `
                            <tr>
                                <td>
                                    <span class="action-badge action-${activity.action}">
                                        ${activity.action === 'login' ? '🟢 Login' : '🔴 Logout'}
                                    </span>
                                </td>
                                <td class="timestamp">${new Date(activity.created_at).toLocaleString()}</td>
                                <td class="ip-address">${activity.ip_address}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function displayActivities(activities) {
            const contentDiv = document.getElementById('content');

            if (!activities || activities.length === 0) {
                contentDiv.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <p>No activities to display</p>
                    </div>
                `;
                return;
            }

            contentDiv.innerHTML = `
                <h3 style="margin-bottom: 12px; color: #0f172a;">All Activities (Last ${activities.length})</h3>
                <table class="activity-table">
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Resource</th>
                            <th>Date & Time</th>
                            <th>IP Address</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${activities.map(activity => `
                            <tr>
                                <td>
                                    <span class="action-badge action-${activity.action}">
                                        ${getActionEmoji(activity.action)} ${activity.action}
                                    </span>
                                </td>
                                <td>${activity.resource_type}</td>
                                <td class="timestamp">${new Date(activity.created_at).toLocaleString()}</td>
                                <td class="ip-address">${activity.ip_address}</td>
                                <td class="metadata">${activity.metadata ? parseMetadata(activity.metadata) : '—'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function getActionEmoji(action) {
            const emojis = {
                'login': '🟢',
                'logout': '🔴',
                'signup': '✨',
                'submitted': '📝',
                'viewed': '👁️'
            };
            return emojis[action] || '•';
        }

        function parseMetadata(metadataStr) {
            try {
                const data = JSON.parse(metadataStr);
                return Object.entries(data)
                    .map(([k, v]) => `${k}: ${v}`)
                    .join(' | ');
            } catch {
                return metadataStr;
            }
        }

        // Load initial data
        window.addEventListener('load', () => {
            loadActivities('my_activities');
        });
    </script>
</body>
</html>
