<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaTeX Skill Check - Axio</title>
  <link rel="stylesheet" href="../css/axio-app.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .skill-check-container {
      width: 100%;
      max-width: 640px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .skill-check-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
      color: white;
      padding: 40px 32px;
      text-align: center;
    }

    .skill-check-header h1 {
      font-size: 1.8rem;
      margin: 0 0 8px;
      font-weight: 700;
    }

    .skill-check-header p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin: 0;
    }

    .skill-check-content {
      padding: 40px 32px;
    }

    .skill-check-question {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 32px;
      text-align: center;
    }

    .skill-options {
      display: grid;
      gap: 16px;
    }

    .skill-option {
      position: relative;
      cursor: pointer;
    }

    .skill-option input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      left: 0;
      top: 0;
    }

    .skill-card {
      padding: 20px 24px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .skill-card:hover {
      border-color: #cbd5e1;
      background: #f1f5f9;
    }

    .skill-option input:checked + .skill-card {
      border-color: #059669;
      background: #d1fae5;
    }

    .skill-card-title {
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .skill-card-description {
      font-size: 0.9rem;
      color: #475569;
      margin: 0;
      line-height: 1.5;
    }

    .skill-check-actions {
      margin-top: 32px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
    }

    .btn-primary {
      background: #059669;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #047857;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #1e3a8a;
      border: 2px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .skill-message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .skill-message.show {
      display: block;
    }

    .skill-message.success {
      background: #d1fae5;
      color: #065f46;
    }

    @media (max-width: 500px) {
      .skill-check-header {
        padding: 32px 24px;
      }

      .skill-check-content {
        padding: 32px 24px;
      }

      .skill-check-header h1 {
        font-size: 1.5rem;
      }

      .skill-card {
        padding: 16px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="skill-check-container">
    <div class="skill-check-header">
      <h1>LaTeX Skill Check</h1>
      <p>Help us personalize your Axio experience</p>
    </div>

    <div class="skill-check-content">
      <p class="skill-check-question">
        Are you familiar with writing mathematical expressions using LaTeX?
      </p>

      <form id="skill-form" class="skill-options">
        <!-- Option 1: Yes, I know LaTeX -->
        <label class="skill-option">
          <input type="radio" name="latex-skill" value="yes" required />
          <div class="skill-card">
            <p class="skill-card-title">✓ Yes, I know LaTeX</p>
            <p class="skill-card-description">You will use the LaTeX Proof Editor, allowing you to write mathematical expressions using LaTeX syntax.</p>
          </div>
        </label>

        <!-- Option 2: No, I'm not familiar -->
        <label class="skill-option">
          <input type="radio" name="latex-skill" value="no" required />
          <div class="skill-card">
            <p class="skill-card-title">✗ No, I'm not familiar with LaTeX</p>
            <p class="skill-card-description">You can write proofs using natural language, and Axio will help guide your reasoning.</p>
          </div>
        </label>
      </form>

      <div class="skill-message" id="skill-message"></div>

      <div class="skill-check-actions">
        <button type="button" class="btn btn-secondary" onclick="goBack()">Back</button>
        <button type="button" class="btn btn-primary" id="continue-btn" disabled onclick="handleContinue()">Continue</button>
      </div>
    </div>
  </div>

  <script>
    let currentUserId = null;
    const skillForm = document.getElementById('skill-form');
    const continueBtn = document.getElementById('continue-btn');
    const messageEl = document.getElementById('skill-message');

    // Enable continue button when an option is selected
    skillForm.addEventListener('change', () => {
      const selected = document.querySelector('input[name="latex-skill"]:checked');
      continueBtn.disabled = !selected;
    });

    function showMessage(text, type = 'error') {
      messageEl.textContent = text;
      messageEl.className = `skill-message show ${type}`;
      setTimeout(() => {
        messageEl.classList.remove('show');
      }, 3000);
    }

    async function handleContinue() {
      const selected = document.querySelector('input[name="latex-skill"]:checked');
      if (!selected) {
        showMessage('Please select an option');
        return;
      }

      const selectedValue = selected.value;
      
      // Map user response to skill level
      // "yes" (familiar with LaTeX) → "advanced"
      // "no" (not familiar) → "beginner"
      const skillLevel = selectedValue === 'yes' ? 'advanced' : 'beginner';

      try {
        // Save the skill level to backend
        const response = await fetch('../../backend/api/user-preferences.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'set_latex_skill',
            level: skillLevel
          }),
          credentials: 'include'
        });

        const data = await response.json();

        if (!data.success) {
          showMessage('Error saving preferences', 'error');
          // Continue anyway but log the error
          console.error('Failed to save preferences:', data);
        }

        // Mark skill check as done in sessionStorage
        if (currentUserId) {
          sessionStorage.setItem('latex_skill_checked_' + currentUserId, 'true');
        }
        sessionStorage.setItem('latex_skill_done', 'true');
        sessionStorage.setItem('latex_skill_level', skillLevel);

        // If user is familiar with LaTeX (advanced), skip tutorial entirely
        if (skillLevel === 'advanced') {
          console.log('User is advanced in LaTeX - skipping tutorial');
          try {
            const skipResponse = await fetch('../../backend/api/user-preferences.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'skip_tutorial'
              }),
              credentials: 'include'
            });
            const skipData = await skipResponse.json();
            console.log('Skip tutorial response:', skipData);
            if (skipData.success) {
              showMessage('Welcome back! Going to dashboard...', 'success');
              // Delay to ensure backend updates
              setTimeout(() => {
                window.location.href = 'dashboard.html';
              }, 1000);
              return;
            } else {
              console.error('Skip tutorial failed:', skipData);
              // If skip_tutorial fails, still go to dashboard
              setTimeout(() => {
                window.location.href = 'dashboard.html';
              }, 1000);
              return;
            }
          } catch (err) {
            console.error('Error skipping tutorial:', err);
            // If API fails, still go to dashboard
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
            return;
          }
        }

        // Beginner users need tutorial
        showMessage('Preferences saved! Redirecting to tutorial...', 'success');
        setTimeout(() => {
          window.location.href = 'tutorial.html';
        }, 1000);
      } catch (err) {
        console.error('Error saving preference:', err);
        // Continue anyway but use sessionStorage as fallback
        sessionStorage.setItem('latex_skill_done', 'true');
        sessionStorage.setItem('latex_skill_level', skillLevel);
        
        // Still route correctly even if API fails
        if (skillLevel === 'advanced') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'tutorial.html';
        }
      }
    }

    function goBack() {
      window.location.href = 'auth.html?mode=login';
    }

    // Note: Auth is already verified by landing.html before routing here
    // No need to re-check on every page load
  </script>
</body>
</html>
