<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axio - Authentication</title>
  <link rel="stylesheet" href="../css/axio-app.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .auth-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
      color: white;
      padding: 32px 24px;
      text-align: center;
    }

    .auth-header h1 {
      font-size: 1.6rem;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .auth-header p {
      font-size: 0.9rem;
      opacity: 0.9;
      margin: 0;
    }

    .auth-content {
      padding: 32px 24px;
    }

    .auth-form {
      display: grid;
      gap: 14px;
    }

    .form-group {
      display: grid;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 45px !important;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      color: #64748b;
    }

    .password-toggle:hover {
      color: #059669;
      background: rgba(5, 150, 105, 0.08);
    }

    .password-toggle:active {
      transform: scale(0.95);
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .form-group.hidden {
      display: none;
    }

    .form-actions {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-primary {
      background: #059669;
      color: white;
    }

    .btn-primary:hover {
      background: #047857;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #1e3a8a;
      border: 2px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .auth-toggle {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 0.9rem;
      color: #475569;
    }

    .auth-toggle button {
      background: none;
      border: none;
      color: #059669;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-left: 4px;
    }

    .auth-toggle button:hover {
      color: #047857;
    }

    .auth-toggle-link {
      background: none;
      border: none;
      color: #059669;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-left: 4px;
      padding: 0;
      display: inline;
    }

    .auth-toggle-link:hover {
      color: #047857;
    }

    .auth-message {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      min-height: 20px;
      display: none;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.success {
      background: #d1fae5;
      color: #065f46;
    }

    .auth-message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      color: #059669;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .forgot-password {
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    .forgot-password.show {
      display: block;
    }

    .forgot-password a {
      color: #059669;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .auth-container {
        border-radius: 12px;
      }

      .auth-content {
        padding: 24px 20px;
      }

      .auth-header {
        padding: 24px 20px;
      }

      .auth-header h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1 id="auth-title">Create Account</h1>
      <p id="auth-subtitle">Join Axio to start your learning journey</p>
    </div>

    <div class="auth-content">
      <form id="auth-form" class="auth-form">
        <!-- Full Name (signup only) -->
        <div class="form-group hidden" id="fullname-group">
          <label>Full Name</label>
          <input id="fullname" type="text" placeholder="John Doe" />
        </div>

        <!-- Username (login + signup) -->
        <div class="form-group" id="username-group">
          <label id="username-label">Username</label>
          <input id="username" type="text" placeholder="Enter your username" required />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input id="password" type="password" placeholder="Enter password (min. 6 characters)" required />
            <button type="button" class="password-toggle" id="toggle-password-btn" onclick="togglePasswordVisibility()" title="Show/hide password">
              <svg id="password-icon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password (signup only) -->
        <div class="form-group hidden" id="confirm-password-group">
          <label>Confirm Password</label>
          <div class="password-wrapper">
            <input id="confirm-password" type="password" placeholder="Confirm password" />
            <button type="button" class="password-toggle" onclick="toggleConfirmPasswordVisibility()" title="Show/hide password">
              <svg id="confirm-password-icon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="auth-message" id="auth-message"></div>

        <!-- Forgot Password (login only) -->
        <div id="forgot-password-div" class="forgot-password">
          <a href="#" id="forgot-password-link">Forgot password?</a>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Sign Up</button>
        </div>
      </form>

      <!-- Toggle -->
      <div class="auth-toggle">
        <span id="toggle-text">Already have an account?</span>
        <a href="#" class="auth-toggle-link" id="toggle-btn" onclick="toggleMode(event)">Log In</a>
      </div>

      <a href="landing.html" class="back-link">← Back to home</a>
    </div>
  </div>

  <script>
    let currentMode = 'signup';
    const messageEl = document.getElementById('auth-message');

    function validateUsername(username) {
      const regex = /^[a-zA-Z0-9._-]{3,20}$/;
      return regex.test(username);
    }

    async function checkUsernameAvailability(username) {
      try {
        const response = await fetch('../../backend/api/auth.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'check_username',
            username: username
          })
        });
        const data = await response.json();
        return data.available === true;
      } catch (err) {
        console.error('Username check error:', err);
        return null;
      }
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('password-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        passwordInput.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function toggleConfirmPasswordVisibility() {
      const confirmInput = document.getElementById('confirm-password');
      const icon = document.getElementById('confirm-password-icon');
      
      if (confirmInput.type === 'password') {
        confirmInput.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        confirmInput.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function toggleMode(e) {
      e.preventDefault();
      if (currentMode === 'signup') {
        switchToLogin();
      } else {
        switchToSignup();
      }
    }

    function switchToSignup() {
      currentMode = 'signup';
      document.getElementById('auth-title').textContent = 'Create Account';
      document.getElementById('auth-subtitle').textContent = 'Join Axio to start your learning journey';
      document.getElementById('submit-btn').textContent = 'Sign Up';
      document.getElementById('fullname-group').classList.remove('hidden');
      document.getElementById('confirm-password-group').classList.remove('hidden');
      document.getElementById('forgot-password-div').classList.remove('show');
      document.getElementById('toggle-text').textContent = 'Already have an account?';
      document.getElementById('toggle-btn').textContent = 'Log In';
      document.getElementById('username-label').textContent = 'Username';
    }

    function switchToLogin() {
      currentMode = 'login';
      document.getElementById('auth-title').textContent = 'Welcome Back';
      document.getElementById('auth-subtitle').textContent = 'Log in to continue your learning';
      document.getElementById('submit-btn').textContent = 'Log In';
      document.getElementById('fullname-group').classList.add('hidden');
      document.getElementById('confirm-password-group').classList.add('hidden');
      document.getElementById('forgot-password-div').classList.add('show');
      document.getElementById('toggle-text').textContent = "Don't have an account?";
      document.getElementById('toggle-btn').textContent = 'Sign Up';
      document.getElementById('username-label').textContent = 'Username';
      messageEl.classList.remove('show');
    }

    function showMessage(text, type = 'error') {
      messageEl.textContent = text;
      messageEl.className = `auth-message show ${type}`;
      setTimeout(() => {
        messageEl.classList.remove('show');
      }, 5000);
    }

    async function handleAuth(e) {
      e.preventDefault();

      if (currentMode === 'signup') {
        handleSignup();
      } else {
        handleLogin();
      }
    }

    async function handleSignup() {
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value?.trim();
      const fullname = document.getElementById('fullname').value?.trim();
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!fullname) {
        showMessage('Please enter your full name');
        return;
      }
      if (!username) {
        showMessage('Please enter your username');
        return;
      }
      if (!validateUsername(username)) {
        showMessage('Username must be 3-20 characters (letters, numbers, dots, underscores, hyphens only)');
        return;
      }
      if (password.length < 6) {
        showMessage('Password must be at least 6 characters');
        return;
      }
      if (password !== confirmPassword) {
        showMessage('Passwords do not match');
        return;
      }

      showMessage('Checking username availability...', 'success');
      const isAvailable = await checkUsernameAvailability(username);
      
      if (isAvailable === false) {
        showMessage('Username already taken. Please choose another one.');
        return;
      } else if (isAvailable === null) {
        showMessage('Could not verify username. Please try again.');
        return;
      }

      try {
        const response = await fetch('../../backend/api/auth.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'register',
            username: username,
            password: password
          }),
          credentials: 'include'
        });

        const data = await response.json();
        
        if (data.success) {
          showMessage('Account created! Signing you in...', 'success');
          
          setTimeout(() => {
            fetch('../../backend/api/auth.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'login',
                username: username,
                password: password
              }),
              credentials: 'include'
            })
            .then(r => r.json())
            .then(loginData => {
              if (loginData.success) {
                sessionStorage.setItem('user_id', loginData.user_id);
                sessionStorage.setItem('username', loginData.username);
                sessionStorage.setItem('new_user', 'true');
                
                showMessage('Welcome! Starting your skill assessment...', 'success');
                setTimeout(() => {
                  window.location.href = 'latex-skill-check.html';
                }, 800);
              } else {
                showMessage('Account created! Please log in now.', 'success');
                setTimeout(() => {
                  switchToLogin();
                }, 1500);
              }
            })
            .catch(err => {
              console.error('Auto-login error:', err);
              showMessage('Account created! Please log in now.', 'success');
              setTimeout(() => {
                switchToLogin();
              }, 1500);
            });
          }, 500);
        } else {
          showMessage(data.message || 'Sign up failed');
        }
      } catch (err) {
        console.error('Signup error:', err);
        showMessage('An error occurred. Please try again.');
      }
    }

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username) {
        showMessage('Please enter your username');
        return;
      }
      if (!password) {
        showMessage('Please enter your password');
        return;
      }

      try {
        const response = await fetch('../../backend/api/auth.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'login',
            username: username,
            password: password
          }),
          credentials: 'include'
        });

        const data = await response.json();
        
        if (data.success) {
          showMessage('Login successful! Redirecting...', 'success');
          sessionStorage.setItem('user_id', data.user_id);
          sessionStorage.setItem('username', data.username);
          
          setTimeout(() => {
            window.location.href = 'landing.html';
          }, 500);
        } else {
          showMessage(data.message || 'Login failed');
        }
      } catch (err) {
        console.error('Login error:', err);
        showMessage('An error occurred. Please try again.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      switchToSignup();
      document.getElementById('auth-form').addEventListener('submit', handleAuth);
      
      document.getElementById('forgot-password-link').addEventListener('click', (e) => {
        e.preventDefault();
        showMessage('Password reset feature coming soon. Please contact support.', 'error');
      });
    });
  </script>
</body>
</html>
