services:
- type: web
  name: axio-ai-tutor
  runtime: php
  buildCommand: composer install --no-dev --optimize-autoloader
  startCommand: php -S 0.0.0.0:${PORT}
  envVars:
  - key: DEEPSEEK_API_KEY
    scope: run
  - key: app_mode
    value: production
    scope: run
  - key: database_mode
    value: demo
    scope: run
  - key: backend_url
    value: /backend/api/
    scope: run
  - key: frontend_url
    value: /frontend/
    scope: run
  healthCheckPath: /
  headers:
  - name: X-Frame-Options
    value: SAMEORIGIN
  - name: X-Content-Type-Options
    value: nosniff
