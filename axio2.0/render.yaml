services:
  - type: web
    name: axio-app
    runtime: php
    plan: free
    startCommand: php -S 0.0.0.0:${PORT}
    buildCommand: |
      echo "Building AXIO app..."
      composer install --no-dev --optimize-autoloader 2>&1
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: '8080'
        scope: run
      - key: DEEPSEEK_API_KEY
        scope: build
