<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axio - Mathematical Proof Assistant</title>
  <link rel="stylesheet" href="../css/axio-app.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .landing-container {
      width: 100%;
      max-width: 720px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .landing-content {
      padding: 60px 40px;
      text-align: center;
    }

    .landing-logo {
      font-size: 3rem;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1e3a8a;
    }

    .landing-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .landing-subtitle {
      font-size: 1.05rem;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .landing-description {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 40px;
      line-height: 1.7;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .landing-actions {
      display: flex;
      gap: 16px;
      flex-direction: column;
    }

    .btn {
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      width: 100%;
    }

    .btn-primary {
      background: #059669;
      color: white;
    }

    .btn-primary:hover {
      background: #047857;
      box-shadow: 0 8px 16px rgba(5, 150, 105, 0.3);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: #1e3a8a;
      border: 2px solid #1e3a8a;
    }

    .btn-secondary:hover {
      background: #f0f4ff;
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      .landing-content {
        padding: 40px 24px;
      }

      .landing-title {
        font-size: 1.8rem;
      }

      .landing-subtitle {
        font-size: 0.95rem;
      }

      .landing-logo {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <div class="landing-content">
      <div class="landing-logo">◯</div>
      
      <h1 class="landing-title">Welcome to Axio</h1>
      
      <p class="landing-subtitle">An AI-assisted platform for learning mathematical proof writing.</p>
      
      <p class="landing-description">
        Axio helps students strengthen their logical reasoning and proof-writing skills through guided exercises, AI assistance, and structured feedback.
      </p>

      <div class="landing-actions">
        <button class="btn btn-primary" onclick="navigateTo('auth.html?mode=login')">Log In</button>
        <button class="btn btn-secondary" onclick="navigateTo('auth.html?mode=signup')">Sign Up</button>
      </div>
    </div>
  </div>

  <script>
    function navigateTo(page) {
      window.location.href = page;
    }

    // Check if user is already logged in
    function checkAuth() {
      console.log('Landing page: Checking if already authenticated...');
      
      fetch('../../backend/api/auth.php?action=check_session', {
        method: 'GET',
        credentials: 'include'
      })
      .then(r => r.json())
      .then(data => {
        console.log('Landing auth check response:', data);
        
        if (data.authenticated) {
          console.log('User already logged in, redirecting to skill check');
          // User is logged in, skip landing page
          sessionStorage.setItem('current_user_id', data.user_id);
          
          const skillCheckDone = sessionStorage.getItem('latex_skill_done');
          const tutorialDone = sessionStorage.getItem('tutorial_completed');
          
          if (!skillCheckDone) {
            window.location.href = 'latex-skill-check.html';
          } else if (!tutorialDone) {
            window.location.href = 'tutorial.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }
      })
      .catch(err => {
        console.error('Landing auth check failed:', err);
        // Not authenticated, stay on landing page
      });
    }

    // Check auth on page load
    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
