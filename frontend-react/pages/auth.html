<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axio - Authentication</title>
  <link rel="stylesheet" href="../css/axio-app.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .auth-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
      color: white;
      padding: 32px 24px;
      text-align: center;
    }

    .auth-header h1 {
      font-size: 1.6rem;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .auth-header p {
      font-size: 0.9rem;
      opacity: 0.9;
      margin: 0;
    }

    .auth-content {
      padding: 32px 24px;
    }

    .auth-form {
      display: grid;
      gap: 14px;
    }

    .form-group {
      display: grid;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }

    .form-group.hidden {
      display: none;
    }

    .form-actions {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-primary {
      background: #059669;
      color: white;
    }

    .btn-primary:hover {
      background: #047857;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #1e3a8a;
      border: 2px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .auth-toggle {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 0.9rem;
      color: #475569;
    }

    .auth-toggle button {
      background: none;
      border: none;
      color: #059669;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-left: 4px;
    }

    .auth-toggle button:hover {
      color: #047857;
    }

    .auth-message {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      min-height: 20px;
      display: none;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.success {
      background: #d1fae5;
      color: #065f46;
    }

    .auth-message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      color: #059669;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .auth-container {
        border-radius: 12px;
      }

      .auth-content {
        padding: 24px 20px;
      }

      .auth-header {
        padding: 24px 20px;
      }

      .auth-header h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1 id="auth-title">Create Account</h1>
      <p id="auth-subtitle">Join Axio to start your learning journey</p>
    </div>

    <div class="auth-content">
      <form id="auth-form" class="auth-form">
        <!-- Full Name (signup only) -->
        <div class="form-group hidden" id="fullname-group">
          <label>Full Name</label>
          <input id="fullname" type="text" placeholder="John Doe" />
        </div>

        <!-- Email / Username -->
        <div class="form-group">
          <label id="email-label">Email Address</label>
          <input id="email" type="email" placeholder="name@example.com" required />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <input id="password" type="password" placeholder="Enter password (min. 6 characters)" required />
        </div>

        <!-- Confirm Password (signup only) -->
        <div class="form-group hidden" id="confirm-password-group">
          <label>Confirm Password</label>
          <input id="confirm-password" type="password" placeholder="Confirm password" />
        </div>

        <!-- Messages -->
        <div class="auth-message" id="auth-message"></div>

        <!-- Actions -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Sign Up</button>
        </div>
      </form>

      <!-- Toggle -->
      <div class="auth-toggle">
        <span id="toggle-text">Already have an account?</span>
        <button id="toggle-btn" onclick="toggleMode()">Log In</button>
      </div>

      <a href="landing.html" class="back-link">← Back to home</a>
    </div>
  </div>

  <script>
    let currentMode = 'signup'; // 'signup' or 'login'
    const messageEl = document.getElementById('auth-message');

    // Parse URL parameters to determine mode
    function initMode() {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode') || 'signup';
      if (mode === 'login') {
        switchToLogin();
      } else {
        switchToSignup();
      }
    }

    function switchToSignup() {
      currentMode = 'signup';
      document.getElementById('auth-title').textContent = 'Welcome to Axio';
      document.getElementById('auth-subtitle').textContent = 'Sign up to get started with proof writing';
      document.getElementById('fullname-group').classList.remove('hidden');
      document.getElementById('confirm-password-group').classList.remove('hidden');
      document.getElementById('email-label').textContent = 'Email Address';
      document.getElementById('email').placeholder = 'name@example.com';
      document.getElementById('email').type = 'email';
      document.getElementById('submit-btn').textContent = 'Create Account';
      document.getElementById('toggle-text').textContent = 'Already have an account?';
      document.getElementById('toggle-btn').textContent = 'Log In';
    }

    function switchToLogin() {
      currentMode = 'login';
      document.getElementById('auth-title').textContent = 'Welcome Back';
      document.getElementById('auth-subtitle').textContent = 'Log in to continue your learning';
      document.getElementById('fullname-group').classList.add('hidden');
      document.getElementById('confirm-password-group').classList.add('hidden');
      document.getElementById('email-label').textContent = 'Email Address';
      document.getElementById('email').placeholder = 'name@example.com';
      document.getElementById('email').type = 'email';
      document.getElementById('submit-btn').textContent = 'Log In';
      document.getElementById('toggle-text').textContent = `Don't have an account?`;
      document.getElementById('toggle-btn').textContent = 'Sign Up';
    }

    function toggleMode() {
      if (currentMode === 'signup') {
        switchToLogin();
      } else {
        switchToSignup();
      }
    }

    function showMessage(text, type = 'error') {
      messageEl.textContent = text;
      messageEl.className = `auth-message show ${type}`;
      setTimeout(() => {
        messageEl.classList.remove('show');
      }, 5000);
    }

    async function handleAuth(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullname = document.getElementById('fullname').value?.trim();
      const confirmPassword = document.getElementById('confirm-password').value;

      if (currentMode === 'signup') {
        // Validation
        if (!fullname) {
          showMessage('Please enter your full name');
          return;
        }
        if (!email) {
          showMessage('Please enter your email');
          return;
        }
        if (password.length < 6) {
          showMessage('Password must be at least 6 characters');
          return;
        }
        if (password !== confirmPassword) {
          showMessage('Passwords do not match');
          return;
        }

        // For now, we'll use email as username (you can modify this later)
        const username = email.split('@')[0];

        try {
          const response = await fetch('../../backend/api/auth.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'register',
              username: username,
              password: password
            })
          });

          const data = await response.json();
          console.log('Signup response:', data);
          
          if (data.success) {
            showMessage('Account created! Signing you in...', 'success');
            console.log('Registration successful, attempting auto-login...');
            
            // Immediately login the new user
            setTimeout(() => {
              fetch('../../backend/api/auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  action: 'login',
                  username: username,
                  password: password
                }),
                credentials: 'include'
              })
              .then(r => r.json())
              .then(loginData => {
                console.log('Auto-login response:', loginData);
                
                if (loginData.success) {
                  console.log('Auto-login successful! User ID:', loginData.user_id);
                  
                  // Set user info
                  sessionStorage.setItem('user_id', loginData.user_id);
                  sessionStorage.setItem('username', loginData.username);
                  
                  // Mark as new user and set skip flags
                  sessionStorage.setItem('new_user', 'true');
                  sessionStorage.setItem('latex_skill_done', 'true');
                  
                  console.log('Flags set, redirecting to tutorial...');
                  showMessage('Welcome! Starting your tutorial...', 'success');
                  
                  // Short delay then redirect straight to tutorial
                  setTimeout(() => {
                    window.location.href = 'tutorial.html';
                  }, 800);
                } else {
                  console.error('Auto-login failed:', loginData);
                  showMessage('Account created! Please log in now.', 'success');
                  setTimeout(() => {
                    window.location.href = 'auth.html?mode=login';
                  }, 1500);
                }
              })
              .catch(err => {
                console.error('Auto-login error:', err);
                showMessage('Account created! Please log in now.', 'success');
                setTimeout(() => {
                  window.location.href = 'auth.html?mode=login';
                }, 1500);
              });
            }, 500);
          } else {
            showMessage(data.message || 'Sign up failed');
            console.error('Signup failed:', data);
          }
        } catch (err) {
          console.error('Signup error:', err);
          showMessage('An error occurred. Please try again.');
        }
      } else {
        // Login - for existing users
        if (!email) {
          showMessage('Please enter your email');
          return;
        }
        if (!password) {
          showMessage('Please enter your password');
          return;
        }

        const username = email.split('@')[0];

        try {
          const response = await fetch('../../backend/api/auth.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'login',
              username: username,
              password: password
            }),
            credentials: 'include'
          });

          const data = await response.json();
          console.log('Login response:', data);
          
          if (data.success) {
            showMessage('Login successful! Redirecting...', 'success');
            // Set user info
            sessionStorage.setItem('user_id', data.user_id);
            sessionStorage.setItem('username', data.username);
            
            setTimeout(() => {
              // Redirect to index.html which will route based on user's progress
              window.location.href = '../index.html';
            }, 500);
          } else {
            showMessage(data.message || 'Login failed');
            console.error('Login failed:', data);
          }
        } catch (err) {
          console.error('Login error:', err);
          showMessage('An error occurred. Please try again.');
        }
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      initMode();
      document.getElementById('auth-form').addEventListener('submit', handleAuth);
    });
  </script>
</body>
</html>
